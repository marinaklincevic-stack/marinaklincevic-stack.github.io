<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заявка отправлена</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f1f7f2;
  font-family: Arial, sans-serif;
  color: #17221d;
}
.box {
  width: min(620px, calc(100% - 30px));
  background: white;
  border-radius: 24px;
  padding: 55px 35px;
  text-align: center;
  box-shadow: 0 20px 60px #34563e18;
}
.check {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: #5b9b77;
  color: white;
  display: grid;
  place-items: center;
  font-size: 38px;
  margin: 0 auto 25px;
}
h1 {
  font-size: 36px;
}
p {
  color: #68746c;
  line-height: 1.7;
}
.btn {
  display: inline-block;
  background: #5b9b77;
  color: white;
  padding: 14px 24px;
  border-radius: 11px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>
<main class="box">
  <div class="check">✓</div>
  <h1>Заявка отправлена!</h1>
  <p>Спасибо! Мы получили вашу заявку и скоро свяжемся с вами.</p>
  <a class="btn" href="/">Вернуться на сайт</a>
</main>
</body>
</html>
